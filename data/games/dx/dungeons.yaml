# Dungeons in the order they unlock (story first, then post-game), as listed by Serebii.
# Artwork: public/dungeons/dx/<id>.webp, downloaded by `npm run artwork`.
# Serebii doesn't list Rock Path or Snow Path (and has no artwork for them); they sit
# where they unlock in the story, right after Lapis Cave and Mt. Blaze.
#
# floors: how many floors it has (the last one included), from the ROM tables in pmd-gen (rescue.yaml's
#   source); Rock Path, Snow Path and Meteor Cave, which pmd-gen leaves out, from Poképédia and WikiDex.
#   Illusory Grotto has none: its floors change. `floors` in pokemon.yaml count from 1, the first floor.
# basement: it goes down. The game numbers its floors B1F, B2F... (shown as -1, -2...). Without it,
#   it goes up from the ground floor, 1F, 2F... in English (shown as 0, 1...: PB, P1... in Spanish).
#   From the DX tables on Poképédia, which agree with Serebii's final floors (B3F, 9F) except on
#   Magma Cavern, Unown Relic, Wish Cave and Silver Trench, where WikiDex sides with Poképédia.

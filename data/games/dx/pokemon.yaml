# Recruitable Pokémon in PMD: Rescue Team DX, in National Dex order.
# id: stable entry id used for saved progress (defaults to the species id; forms get a suffix).
# species: shared species id (omitted when equal to id).
# evolve: what it takes to evolve into it from its pre-evolution (shared/species.yaml `evolvesFrom`).
#   Required when the pre-evolution is in this game, not allowed otherwise. `level`, and/or `item`
#   with an optional `count` (default 1). Source: Serebii's per-Pokémon DX pages.
# obtain: other ways to get it. `method` must be one of the methods in game.yaml. Where known,
#   `floors` ("1-3, 5"), the Pokémon's `level` there and its base recruit `rate` (%; negative means
#   it can't be recruited without boosts). Source: the DX tables on Bulbapedia's dungeon pages.
# shiny: it can be Shiny, and the Shiny one shows up by these methods of its `obtain` (only those).
#   The build adds the Shiny one as its own entry (`<id>-shiny`) right after it. Source: Serebii's
#   Shiny Pokémon page (strong foes, plus Celebi in a Mystery House).

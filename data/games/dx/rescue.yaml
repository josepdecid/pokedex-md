# What the numbers inside a rescue password mean (Rescues page, src/lib/rescue/).
# A rescue request stores its dungeon and Pokémon as the game's internal indexes.
# Source: the ROM tables in pmd-gen (https://github.com/Karthik99999/pmd-gen, MIT),
# matched to our ids by English name. Indexes the game never uses are left out.
#
# dungeons: <index>: <dungeons.yaml id> (its floor count comes from dungeons.yaml)
#   The dungeons pmd-gen accepts in a rescue request (Rock Path, Snow Path and the Mazes aren't).
# pokemon: <index>: <pokemon.yaml entry id (Unown letters, -shiny ones), or a species id
#   when it isn't a checklist entry (Deoxys' other forms share Deoxys' entry)>
